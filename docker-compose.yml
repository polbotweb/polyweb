# ── Docker Compose — local development ────────────────────────────────
# Usage:
#   docker compose up -d         → start PostgreSQL + app
#   docker compose up -d db      → start only PostgreSQL
#   docker compose down -v       → stop and remove volumes
#
# For production, use only the Dockerfile with your orchestrator (k8s, ECS, Fly, etc.)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polyweb
      POSTGRES_PASSWORD: polyweb_dev_password
      POSTGRES_DB: polyweb_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyweb -d polyweb_local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # S3 local optionnel (SeaweedFS, Apache-2.0) : `docker compose --profile s3 up -d s3`
  # puis `aws --endpoint-url http://localhost:8333 s3 mb s3://polyweb` et
  # STORAGE_DRIVER=s3 S3_ENDPOINT=http://localhost:8333 S3_BUCKET=polyweb S3_FORCE_PATH_STYLE=true.
  # Sans Docker : `pnpm s3:local` (même serveur, binaire épinglé). Les tests le démarrent seuls.
  s3:
    image: chrislusf/seaweedfs:4.50
    profiles: ["s3"]
    restart: unless-stopped
    command: server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64 -volume.max=64 -s3 -s3.port=8333 -s3.port.iceberg=0 -s3.port.lance=0 -s3.autoCreateBucket=false
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  app:
    build:
      context: .
      args:
        SITE_URL: http://localhost:4321
        BETTER_AUTH_URL: http://localhost:4321
    restart: unless-stopped
    ports:
      - "4321:4321"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ENV: LOCAL
      DATABASE_URL_LOCAL: postgresql://polyweb:polyweb_dev_password@db:5432/polyweb_local
      BETTER_AUTH_SECRET: dev-secret-replace-in-production-min-32-characters
      BETTER_AUTH_URL: http://localhost:4321
      SITE_URL: http://localhost:4321
      SMTP_PROVIDER: NODEMAILER
      SMTP_FROM_EMAIL: noreply@localhost
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/public/uploads
      - logs:/app/logs

  # Optional: local mail catcher (UI on http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # Optional: HTTPS reverse proxy — `docker compose --profile proxy up -d`
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  s3data:
  uploads:
  logs:
  caddy_data:
  caddy_config:
