# Pipeline de preview (idée reprise d'antx deploy-preview.yml, réécrite :
# pnpm + Drizzle au lieu de npm + Prisma, déclenchée sur pull request).
#
# - a11y-visual : build Node + audit axe + régression visuelle (Chromium)
# - deploy-preview : build Vercel + déploiement preview, uniquement si le secret
#   VERCEL_TOKEN est défini (sinon le job est ignoré proprement).
#   Secrets attendus : VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
#   PREVIEW_DATABASE_URL (base de preview dédiée), BETTER_AUTH_SECRET.
name: Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y-visual:
    name: Accessibility & visual regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polyweb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_ENV: LOCAL
      DATABASE_URL_LOCAL: postgresql://test:test@localhost:5432/polyweb_test
      BETTER_AUTH_SECRET: ci-preview-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:4322
      SITE_URL: http://localhost:4322
      SMTP_PROVIDER: NODEMAILER
      SMTP_FROM_EMAIL: ci@test.local
      SMTP_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:infra && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - name: axe-core audit
        run: pnpm test:a11y
      - name: Visual regression
        # Les références doivent être committées (pnpm test:visual --update-snapshots).
        run: pnpm test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/reports/playwright
          retention-days: 7

  deploy-preview:
    name: Deploy Vercel preview
    runs-on: ubuntu-latest
    needs: a11y-visual
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''
      - uses: pnpm/action-setup@v6
        if: env.VERCEL_TOKEN != ''
        with: { version: 10 }
      - uses: actions/setup-node@v7
        if: env.VERCEL_TOKEN != ''
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - if: env.VERCEL_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Apply migrations on preview database
        if: env.VERCEL_TOKEN != ''
        env:
          DB_ENV: PROD
          DATABASE_URL_PROD: ${{ secrets.PREVIEW_DATABASE_URL }}
          CONFIRM_PROD: "oui"
        run: pnpm db:migrate
      - name: Build (Vercel adapter) & deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          pnpm dlx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --token "$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          ASTRO_ADAPTER: vercel
